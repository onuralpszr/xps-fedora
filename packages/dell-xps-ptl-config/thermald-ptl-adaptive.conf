# Installed by dell-xps-ptl-config as /usr/lib/systemd/system/thermald.service.d/ptl-adaptive.conf
#
# Panther Lake (6:204) is adaptive-only in thermald. At boot thermald can start
# before RAPL, coretemp and the INT3400 SENx/TCPU zones exist; adaptive mode
# then finds none of the PSVT sensors, writes /run/thermald/ignore_adaptive and
# restarts in non-adaptive mode, which refuses this CPU, so thermald stays
# down for the whole boot. Wait for the sensors and clear the marker first.
[Unit]
After=systemd-modules-load.service

[Service]
ExecStartPre=/bin/rm -f /run/thermald/ignore_adaptive
ExecStartPre=/bin/sh -c 'for i in $(seq 60); do [ -e /sys/class/powercap/intel-rapl:0 ] && [ -e /sys/devices/platform/coretemp.0 ] && grep -qx TCPU /sys/class/thermal/thermal_zone*/type 2>/dev/null && exit 0; sleep 0.5; done; echo "thermald: sensors not ready after 30s, starting anyway"'
