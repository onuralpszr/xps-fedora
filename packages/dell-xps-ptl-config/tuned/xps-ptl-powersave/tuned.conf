[main]
summary=Power saver (Dell XPS Panther Lake: Dell thermal mode quiet, SoC slider low-power)
include=powersave

# The legacy platform_profile can't express this machine's modes; the
# xps_platform script sets each handler instead.
[acpi]
replace=1

[xps_platform]
type=script
script=${i:PROFILE_DIR}/platform.sh
