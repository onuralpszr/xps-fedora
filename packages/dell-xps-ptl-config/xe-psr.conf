# Dell XPS 14/16 (Panther Lake, LG OLED, sink OUI 00:22:b9)
#
# PSR2 selective updates don't reach this panel reliably: UI glitches and
# "frozen" screen, and with Panel Replay "Timed out waiting for PSR Idle"
# floods. Without selective fetch the driver uses PSR1 (self-refresh on static
# screens, full frames on updates), which is stable. Panel Replay stays off via
# the upstream quirk. Remove once upstream fixes PSR2 SU on this panel
# (drm/xe #7521).
options xe enable_psr2_sel_fetch=0
