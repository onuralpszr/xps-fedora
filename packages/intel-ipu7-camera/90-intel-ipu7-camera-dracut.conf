# Keep the IPU7 camera drivers out of the initramfs. Fedora's host-only dracut
# picks up the loaded akmod modules, but not intel/ipu/ipu7ptl_fw.bin, so the
# bus driver probes at ~2 s, fails with -ENOENT and never retries once the real
# root (with /lib/firmware) is mounted. The camera isn't needed that early.
omit_drivers+=" intel_ipu7 intel_ipu7_isys intel_ipu7_psys ipu_acpi ipu_acpi_pdata ipu_acpi_common "
