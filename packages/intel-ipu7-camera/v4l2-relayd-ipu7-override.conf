[Unit]
Wants=camera-init.service
After=camera-init.service

[Service]
# Relax Fedora's sandboxing for icamerasrc hardware access
PrivateNetwork=no
InaccessibleDirectories=
ReadOnlyDirectories=
DevicePolicy=auto
# The HAL is heavily multithreaded; LimitNPROC=1 without capabilities
# would stop it from creating threads.
LimitNPROC=infinity
# Let PipeWire re-probe the loopback device once frames flow
ExecStartPost=/bin/bash -c 'sleep 2 && systemctl --user -M 1000@ restart wireplumber.service 2>/dev/null || true'
