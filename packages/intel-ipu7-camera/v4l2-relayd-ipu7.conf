# IPU7 OV08X40 via icamerasrc (hardware ISP) -> v4l2loopback.
# Picked up automatically by Fedora's v4l2-relayd generator (v4l2-relayd@ipu7).
# fps-range/gain-range: in dim light AE lengthens frames down to 15 fps
# instead of holding 30 fps at very high gain.
# color-range=reduced: consumers decode NV12 webcam frames as limited range.
# rotate-180: the sensor is mounted inverted on Panther Lake XPS boards.
VIDEOSRC="icamerasrc device-name=ov08x40-uf fps-range=15~30 gain-range=0~27 color-range=reduced ! videoflip method=rotate-180"
FORMAT=NV12
WIDTH=1920
HEIGHT=1080
FRAMERATE=30/1
# Must match the v4l2loopback card_label in /etc/modprobe.d/v4l2-relayd.conf
CARD_LABEL="Intel MIPI Camera"
