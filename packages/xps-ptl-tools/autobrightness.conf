# xps-ptl-autobrightness defaults. Per-user overrides go in
# ~/.config/xps-ptl/autobrightness.conf (same [autobrightness] section).
# On/off, OSD and the learned preference are kept in
# ~/.local/state/xps-ptl/autobrightness and set from the widget.

[autobrightness]
# "lux:percent" points, interpolated on log10(lux + 1)
#curve = 0:8 10:25 100:45 1000:75 10000:100
#min_percent = 5
#max_percent = 100
# only change brightness when the target differs by at least this much
#hysteresis_percent = 4
# weight of each 2 s control step; lower = smoother, slower
#smoothing = 0.3
# spike filter: the sensor reports short bursts of impossible values, so the
# light level is a low percentile of the last few seconds (0.5 s samples)
#window_seconds = 6
#percentile = 30
# readings above this are treated as sensor glitches
#max_lux = 40000
#fade_ms = 800
# seconds a manual brightness change must hold before it is learned
#learn_after = 10
# a drop to <= this fraction of the previous brightness is treated as
# KDE idle dimming (pause, learn nothing)
#dim_ratio = 0.5
#debug = false
