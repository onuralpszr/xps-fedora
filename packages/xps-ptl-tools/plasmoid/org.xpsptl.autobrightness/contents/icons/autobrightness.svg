<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3e45"/>
      <stop offset="1" stop-color="#1c1e22"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef1f4"/>
      <stop offset="1" stop-color="#9aa2ac"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c3036"/>
      <stop offset="1" stop-color="#15171a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe3a3" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffb84d" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- graphite body with a platinum rim -->
  <rect x="3" y="3" width="58" height="58" rx="13" fill="url(#body)"/>
  <rect x="3.75" y="3.75" width="56.5" height="56.5" rx="12.4" fill="none" stroke="url(#edge)" stroke-width="1.5" opacity="0.85"/>
  <!-- warm light falling on the sensor -->
  <g stroke="#ffcf73" stroke-width="2.6" stroke-linecap="round">
    <path d="M32 8 V13.5"/>
    <path d="M20.5 11 L25 15.8"/>
    <path d="M43.5 11 L39 15.8"/>
  </g>
  <!-- display with platinum bezel -->
  <rect x="9.5" y="21" width="45" height="33" rx="5" fill="url(#screen)" stroke="#d6dbe1" stroke-width="2.4"/>
  <!-- "A" for automatic -->
  <path d="M24.5 48.5 L32 30.5 L39.5 48.5 M27.2 42.6 H36.8" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- sensor in the bezel, lit -->
  <circle cx="32" cy="21" r="7" fill="url(#glow)"/>
  <circle cx="32" cy="21" r="2.8" fill="#ffd27a" stroke="#1c1e22" stroke-width="0.8"/>
  <circle cx="32" cy="21" r="1.1" fill="#fff6dd"/>
</svg>
